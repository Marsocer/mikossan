<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>星砂岛钓鱼佬手记</title>
    <link rel="stylesheet" href="style.css">
    <script>
        var _hmt = _hmt || [];
        (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?9a6b3ce1868acaaec8679f2963414851";
            var s = document.getElementsByTagName("script")[0];
            s.parentNode.insertBefore(hm, s);
        })();
    </script>
</head>
<body>
    <button class="version-switch-btn" onclick="window.location.href='../index.html'">返回旧版</button>
    <div class="tabs-container">
        <button class="tab-btn active" onclick="window.location.href='index.html'">鱼类图鉴</button>
        <button class="tab-btn" onclick="window.location.href='seashore-index.html'">赶海图鉴</button>
        <button class="tab-btn" onclick="window.location.href='insect-index.html'">昆虫图鉴</button>
    </div>
    <div class="container">
        <h1>星砂岛钓鱼佬手记</h1>

        <div class="import-export-btn-group">
            <button id="export-all" class="export-btn">导出图鉴编码</button>
            <button id="import-all" class="import-btn">导入图鉴编码</button>
        </div>

        <div class="tip-text">✨ 收藏标记保存在本地浏览器，更换设备前记得导出编码哦~</div>

        <div class="search-wrapper">
            <input type="text" id="global-search" placeholder="搜索名称 / 季节 / 水域 / 窝料 ...">
            <button id="search-btn" class="search-btn">搜索</button>
        </div>

        <div class="filter-bar">
            <div class="filter-item">
                <label>季节:</label>
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                    <label style="display: flex; align-items: center; gap: 4px; white-space: nowrap;">
                        <input type="checkbox" id="season-precise-toggle"> 精准筛选季节
                    </label>
                    <div class="season-check-group" id="season-group">
                        <label class="season-checkbox-item">
                            <input type="checkbox" value="春" class="season-checkbox"> 春
                        </label>
                        <label class="season-checkbox-item">
                            <input type="checkbox" value="夏" class="season-checkbox"> 夏
                        </label>
                        <label class="season-checkbox-item">
                            <input type="checkbox" value="秋" class="season-checkbox"> 秋
                        </label>
                        <label class="season-checkbox-item">
                            <input type="checkbox" value="冬" class="season-checkbox"> 冬
                        </label>
                    </div>
                </div>
            </div>
            <div class="filter-item">
                <label>水域:</label>
                <select id="water-filter">
                    <option value="all" selected>全部</option>
                    <option value="云霓海域">云霓海域</option>
                    <option value="明洋海域">明洋海域</option>
                    <option value="孢子瀑布(悬梦亭)">孢子瀑布(悬梦亭)</option>
                    <option value="河流">河流</option>
                    <option value="珊瑚海">珊瑚海</option>
                    <option value="暗水畔">暗水畔</option>
                    <option value="湖泊">湖泊</option>
                    <option value="海洋">海洋</option>
                </select>
            </div>
            <div class="filter-item">
                <label>天气:</label>
                <select id="weather-filter">
                    <option value="all" selected>全部</option>
                    <option value="雪天">雪天</option>
                    <option value="晴天">晴天</option>
                    <option value="雨天">雨天</option>
                </select>
            </div>
            <div class="filter-item">
                <label>窝料:</label>
                <select id="bait-filter">
                    <option value="all" selected>全部</option>
                    <option value="鱼肉饵料">鱼肉饵料</option>
                    <option value="昆虫饵料">昆虫饵料</option>
                    <option value="素食饵料">素食饵料</option>
                </select>
            </div>
            <div class="filter-item">
                <label>图鉴状态:</label>
                <select id="collect-filter">
                    <option value="all" selected>全部</option>
                    <option value="collected">已拥有</option>
                    <option value="uncollected">未拥有</option>
                </select>
            </div>
            <div class="filter-item">
                <button id="reset-filter" class="reset-btn">重置筛选</button>
            </div>
        </div>

        <div class="filter-tags" id="filter-tags"></div>

        <div class="stats">
            <span>图鉴总计: <span id="total-count">0</span> 种 | 已收集: <span id="collected-count">0</span> 种</span>
            <div class="progress-container">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill" style="width:0%"></div>
                </div>
                <span class="progress-text" id="progress-text">0%</span>
            </div>
        </div>

        <div id="empty-tip" class="empty-tip hidden">
            <p>暂无匹配的鱼种哦～😟</p>
            <button id="reset-filter-empty" class="reset-btn">一键重置筛选</button>
        </div>

        <div class="name-list" id="name-list"></div>

        <div class="footer-signature">
            <a href="https://docs.qq.com/sheet/DZWRzREJ2Z0ttR0RC?tab=BB08J2" target="_blank" rel="noopener noreferrer">腾讯文档在线表格版(保存到自己的腾讯文档里再用)</a>
            <a href="mailto:socer@foxmail.com" target="_blank" rel="noopener noreferrer">有问题可联系邮箱:socer@foxmail.com</a>
            <a href="https://github.com/Marsocer/mikossan" target="_blank" rel="noopener noreferrer">项目源码托管 · GitHub</a>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
